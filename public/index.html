<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PELANGI HOTEL Tanjungpinang</title>
  <meta name="description" content="Sistem Database Tamu Pelangi Hotel Tanjungpinang. Login untuk mengakses data pelanggan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="logo.png" type="image/png">
  <style>
    /* ── Hotel Photo Background ── */
    body {
      background: #000;
    }
    .hotel-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('hotel-bg.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      /* slight dark overlay so text stays readable */
      filter: brightness(0.55);
      transition: filter 0.5s ease;
    }
    /* Dark gradient overlay on top of photo */
    .hotel-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        135deg,
        rgba(5, 10, 25, 0.55) 0%,
        rgba(10, 20, 50, 0.40) 50%,
        rgba(5, 10, 25, 0.65) 100%
      );
    }
    /* ── Login page centering ── */
    .login-page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* ── Glassmorphism login card ── */
    .login-box {
      background: rgba(10, 14, 26, 0.72) !important;
      backdrop-filter: blur(20px) saturate(160%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow:
        0 8px 48px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
    }
    /* Subtle glow under the card */
    .login-box::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(79,142,247,0.15), rgba(124,58,237,0.08));
      z-index: -1;
      pointer-events: none;
    }
    /* Mobile: make bg stay sharp on small screens */
    @media (max-width: 480px) {
      .hotel-bg { background-position: 60% center; }
    }
  </style>
</head>
<body>
  <div class="hotel-bg"></div>
  <div class="hotel-overlay"></div>

  <div class="login-page">
    <div class="login-box" style="position:relative;z-index:1;">
      <div class="login-logo">
        <img src="logo.png" alt="Pelangi Hotel Logo" style="height: 110px; width: auto; object-fit: contain; margin-bottom: 0.75rem; border-radius: 6px;">
        <h1>PELANGI HOTEL</h1>
        <p>JL D.I PANJAITAN TANJUNGPINANG</p>
      </div>

      <div id="login-error" class="alert alert-error" style="display:none;">
        <span>⚠️</span>
        <span id="login-error-msg"></span>
      </div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-icon-wrap">
            <span class="icon">👤</span>
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Masukkan username"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-icon-wrap">
            <span class="icon">🔒</span>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn" style="margin-top:0.5rem;">
          <span id="login-btn-text">Masuk</span>
          <span id="login-spinner" class="spinner" style="display:none;"></span>
        </button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; font-size:0.78rem; color:var(--text-muted); line-height:1.8;">
        PELANGI HOTEL TANJUNGPINANG - 2026<br>
        <span style="color:var(--text-muted);opacity:0.7;">Created by : AGUS SURIYADI</span>
      </p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');
      const spinner = document.getElementById('login-spinner');
      const errorDiv = document.getElementById('login-error');
      const errorMsg = document.getElementById('login-error-msg');

      btn.disabled = true;
      btnText.textContent = 'Memproses...';
      spinner.style.display = 'inline-block';
      errorDiv.style.display = 'none';

      try {
        const res = await api.post('/auth/login', { username, password });
        if (res.success) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        errorMsg.textContent = err.message || 'Login gagal. Periksa username dan password.';
        errorDiv.style.display = 'flex';
        document.getElementById('username').classList.add('error');
        document.getElementById('password').classList.add('error');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Masuk';
        spinner.style.display = 'none';
      }
    });

    // Remove error style on input
    ['username','password'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('error');
        document.getElementById('login-error').style.display = 'none';
      });
    });
  </script>
</body>
</html>
