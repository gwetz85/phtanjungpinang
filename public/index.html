<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PELANGI HOTEL Tanjungpinang</title>
  <meta name="description" content="Sistem Database Tamu Pelangi Hotel Tanjungpinang. Login untuk mengakses data pelanggan.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-page { background: transparent; }
    .grid-bg {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glow-orb {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
      filter: blur(80px);
    }
    .glow-1 { width: 500px; height: 500px; background: rgba(79,142,247,0.12); top: -100px; left: -100px; }
    .glow-2 { width: 400px; height: 400px; background: rgba(124,58,237,0.1); bottom: -80px; right: -80px; }
  </style>
</head>
<body>
  <div class="bg-animated"></div>
  <div class="grid-bg"></div>
  <div class="glow-orb glow-1"></div>
  <div class="glow-orb glow-2"></div>

  <div class="login-page">
    <div class="login-box" style="position:relative;z-index:1;">
      <div class="login-logo">
        <div class="hotel-icon">🏨</div>
        <h1>PELANGI HOTEL</h1>
        <p>Sistem Database Tamu Hotel</p>
      </div>

      <div id="login-error" class="alert alert-error" style="display:none;">
        <span>⚠️</span>
        <span id="login-error-msg"></span>
      </div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-icon-wrap">
            <span class="icon">👤</span>
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Masukkan username"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-icon-wrap">
            <span class="icon">🔒</span>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn" style="margin-top:0.5rem;">
          <span id="login-btn-text">Masuk</span>
          <span id="login-spinner" class="spinner" style="display:none;"></span>
        </button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; font-size:0.78rem; color:var(--text-muted);">
        © 2026 PELANGI HOTEL Tanjungpinang &nbsp;·&nbsp; Database Management System
      </p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');
      const spinner = document.getElementById('login-spinner');
      const errorDiv = document.getElementById('login-error');
      const errorMsg = document.getElementById('login-error-msg');

      btn.disabled = true;
      btnText.textContent = 'Memproses...';
      spinner.style.display = 'inline-block';
      errorDiv.style.display = 'none';

      try {
        const res = await api.post('/auth/login', { username, password });
        if (res.success) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        errorMsg.textContent = err.message || 'Login gagal. Periksa username dan password.';
        errorDiv.style.display = 'flex';
        document.getElementById('username').classList.add('error');
        document.getElementById('password').classList.add('error');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Masuk';
        spinner.style.display = 'none';
      }
    });

    // Remove error style on input
    ['username','password'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('error');
        document.getElementById('login-error').style.display = 'none';
      });
    });
  </script>
</body>
</html>
