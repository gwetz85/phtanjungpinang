<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PELANGI HOTEL Tanjungpinang</title>
  <meta name="description" content="Sistem Database Tamu Pelangi Hotel Tanjungpinang. Login untuk mengakses data pelanggan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="logo.png" type="image/png">
  <link rel="icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pelangi Hotel">
  <style>
    /* ── Modern White-Green Hotel Background ── */
    body {
      background: #f1f5f3;
      color: #1e293b;
    }
    .hotel-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('hotel-bg.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      filter: brightness(0.92) contrast(1.05);
      transition: filter 0.5s ease;
    }
    /* Clean white-mint overlay with subtle gradient */
    .hotel-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        135deg,
        rgba(241, 245, 243, 0.88) 0%,
        rgba(236, 253, 245, 0.84) 50%,
        rgba(248, 250, 252, 0.90) 100%
      );
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    /* ── Login page centering ── */
    .login-page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    /* ── Modern Minimalist White Card ── */
    .login-box {
      background: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 16px !important;
      box-shadow:
        0 20px 40px -15px rgba(5, 150, 105, 0.15),
        0 0 0 1px rgba(5, 150, 105, 0.05),
        0 8px 16px -4px rgba(15, 23, 42, 0.06) !important;
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2.25rem;
    }
    .login-logo h1 {
      color: #0f172a;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    .login-logo p {
      color: #059669;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-top: 0.25rem;
    }
    /* Mobile: make bg stay sharp on small screens */
    @media (max-width: 480px) {
      .hotel-bg { background-position: 60% center; }
      .login-box { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="hotel-bg"></div>
  <div class="hotel-overlay"></div>

  <div class="login-page">
    <div class="login-box" style="position:relative;z-index:1;">
      <div class="login-logo">
        <img src="logo.png" alt="Pelangi Hotel Logo" style="height: 110px; width: auto; object-fit: contain; margin-bottom: 0.75rem; border-radius: 6px;">
        <h1>PELANGI HOTEL</h1>
        <p>JL D.I PANJAITAN TANJUNGPINANG</p>
      </div>

      <div id="login-error" class="alert alert-error" style="display:none;">
        <span>⚠️</span>
        <span id="login-error-msg"></span>
      </div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-icon-wrap">
            <span class="icon">👤</span>
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Masukkan username"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-icon-wrap">
            <span class="icon">🔒</span>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn" style="margin-top:0.5rem;">
          <span id="login-btn-text">Masuk</span>
          <span id="login-spinner" class="spinner" style="display:none;"></span>
        </button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; font-size:0.78rem; color:var(--text-muted); line-height:1.8;">
        PELANGI HOTEL TANJUNGPINANG - 2026<br>
        <span style="color:var(--text-muted);opacity:0.7;">Created by : AGUS SURIYADI</span>
      </p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');
      const spinner = document.getElementById('login-spinner');
      const errorDiv = document.getElementById('login-error');
      const errorMsg = document.getElementById('login-error-msg');

      btn.disabled = true;
      btnText.textContent = 'Memproses...';
      spinner.style.display = 'inline-block';
      errorDiv.style.display = 'none';

      // Get or generate deviceId
      let deviceId = localStorage.getItem('deviceId');
      if (!deviceId) {
        deviceId = 'DEV-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        localStorage.setItem('deviceId', deviceId);
      }

      try {
        const res = await api.post('/auth/login', { username, password, deviceId });
        if (res.success) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        errorMsg.textContent = err.message || 'Login gagal. Periksa username dan password.';
        errorDiv.style.display = 'flex';
        document.getElementById('username').classList.add('error');
        document.getElementById('password').classList.add('error');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Masuk';
        spinner.style.display = 'none';
      }
    });

    // Remove error style on input
    ['username','password'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('error');
        document.getElementById('login-error').style.display = 'none';
      });
    });
  </script>
</body>
</html>
